name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore ArtifactGrade.slnx --configfile NuGet.Config
      - name: Test
        run: dotnet test tests/ArtifactGrade.Domain.Tests/ArtifactGrade.Domain.Tests.csproj --no-restore --configuration Release
      - name: Build
        run: dotnet build ArtifactGrade.slnx --no-restore --configuration Release
