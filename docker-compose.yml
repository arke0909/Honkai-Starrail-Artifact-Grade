services:
  redis:
    image: redis:7-alpine
    container_name: artifact-grade-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - artifact-grade-redis:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.Api
    container_name: artifact-grade-api
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Redis: redis:6379,abortConnect=false,connectTimeout=1000,syncTimeout=1000
      ClientOrigins__0: http://localhost:8080
    ports:
      - "5072:8080"
    depends_on:
      redis:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: Dockerfile.Client
    container_name: artifact-grade-client
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  artifact-grade-redis:
